<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="mediaTitle">
  <title id="mediaTitle">Abstract media cover with play button and waveform motif</title>
  <defs>
    <linearGradient id="mediaBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b3566" />
      <stop offset="1" stop-color="#2c57a6" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#mediaBg)" />

  <!-- play button -->
  <circle cx="330" cy="225" r="80" fill="#ffffff" opacity="0.12" />
  <circle cx="330" cy="225" r="80" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" />
  <path d="M 310 190 L 368 225 L 310 260 Z" fill="#ffffff" opacity="0.9" />

  <!-- waveform -->
  <g stroke="#ffffff" stroke-linecap="round" stroke-width="8">
    <line x1="470" y1="205" x2="470" y2="245" opacity="0.4" />
    <line x1="495" y1="185" x2="495" y2="265" opacity="0.55" />
    <line x1="520" y1="160" x2="520" y2="290" opacity="0.75" />
    <line x1="545" y1="190" x2="545" y2="260" opacity="0.55" />
    <line x1="570" y1="210" x2="570" y2="240" opacity="0.4" />
    <line x1="595" y1="175" x2="595" y2="275" opacity="0.65" />
    <line x1="620" y1="200" x2="620" y2="250" opacity="0.45" />
  </g>
</svg>
