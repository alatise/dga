<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="reportTitle">
  <title id="reportTitle">Abstract report cover with bar chart and document motif</title>
  <defs>
    <linearGradient id="reportBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b3566" />
      <stop offset="1" stop-color="#2c57a6" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#reportBg)" />

  <!-- document outline -->
  <path
    d="M 520 90 H 660 L 700 130 V 360 H 520 Z"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.2"
    stroke-width="2"
  />
  <path d="M 660 90 V 130 H 700" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2" />
  <g stroke="#ffffff" stroke-opacity="0.18" stroke-width="2">
    <line x1="545" y1="175" x2="675" y2="175" />
    <line x1="545" y1="205" x2="675" y2="205" />
    <line x1="545" y1="235" x2="640" y2="235" />
  </g>

  <!-- bar chart -->
  <g fill="#ffffff">
    <rect x="110" y="280" width="46" height="100" rx="4" opacity="0.55" />
    <rect x="180" y="230" width="46" height="150" rx="4" opacity="0.7" />
    <rect x="250" y="180" width="46" height="200" rx="4" opacity="0.9" />
    <rect x="320" y="255" width="46" height="125" rx="4" opacity="0.65" />
  </g>
  <line x1="90" y1="380" x2="390" y2="380" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" />

  <!-- trend line -->
  <polyline
    points="110,300 180,255 250,150 320,220 390,140"
    fill="none"
    stroke="#ffffff"
    stroke-width="2.5"
    stroke-opacity="0.85"
  />
  <circle cx="390" cy="140" r="6" fill="#ffffff" />
</svg>
